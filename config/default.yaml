project:
  name: quantitative-fx-research
  mode: research_only

timeframes:
  regime: 1d
  signal: 1m
  execution: 1m

vwap:
  anchor_hour_utc: 21
  price: hlc3
  bands_sigmas: [1, 3]
  volume_min_unique_per_session: 2

regime:
  atr_period: 14
  atr_percentile_window: 252
  atr_percentile_min_bars: 30
  high_vol_percentile: 70
  adx_period: 14
  adx_threshold: 25
  ema_period: 50
  ema_slope_lookback: 5
  efficiency_period: 10
  efficiency_threshold: 0.35

refresh:
  window_days: 365
  loop_days: 365
  cron: "0 6 * * 1"
  fetch_days_1m: 8

sources:
  user_downloads_dir: "C:/Users/shasw/Downloads"
  user_files:
    EURUSD: EURUSD1.csv
    XAUUSD: XAUUSD1.csv
    DXY_DAILY: US Dollar Index Historical Data.csv
  user_csv_utc_offset_hours:
    EURUSD: 0
    XAUUSD: 0
  histdata_utc_offset_hours:
    EURUSD: us_eastern_dst
    XAUUSD: us_eastern_dst
    DXY: us_eastern_dst
  histdata_valid_from:
    DXY: "2018-12-16"

signals:
  directory: signals
  schema_version: "1.0"
  archive_days: 365

risk:
  max_risk_per_trade: 0.0025
  max_daily_loss: 0.01
  max_portfolio_drawdown: 0.15
  max_gross_leverage: 2.0
  max_currency_exposure: 0.25

execution:
  include_spread: true
  include_commission: true
  include_slippage: true
  include_latency: true
  model_partial_fills: true
  limit_order_timeout_seconds: 30

validation:
  method: anchored_walk_forward
  final_test_is_locked: true
  minimum_stress_cost_multiplier: 2.0
  paper_trade_before_live: true
